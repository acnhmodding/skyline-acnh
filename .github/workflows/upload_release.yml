name: Upload Release

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
    - name: Clone repo
      run: git clone --recurse-submodules --branch "$GITHUB_REF_NAME" $GITHUB_SERVER_URL/$GITHUB_REPOSITORY .
    - name: make
      run: make
    - name: Prepare ZIP
      run: mkdir exefs && cp *.nso exefs/subsdk9 && cp living_the_dream.npdm exefs/main.npdm && bsdtar -a -cf skyline.zip exefs
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: zip
        path: skyline.zip
  upload:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v4
      with:
        name: zip
    - name: Release (beta)
      if: github.ref == 'refs/heads/master'
      uses: majkrzak/create-release@master
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name: beta
        code: beta
        body: Beta built off of the latest code in the repository.
        prerelease: true
        recreate: true
        assets: skyline.zip:skyline.zip:application/zip
    - name: Generate changelog
      id: changelog
      if: startsWith(github.ref, 'refs/tags/')
      uses: orhun/git-cliff-action@v4
      with:
        config: cliff.toml
        args: --latest --strip header
      env:
        OUTPUT: CHANGELOG.md
    - name: Release (tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: skyline.zip
        body: ${{ steps.changelog.outputs.content }}
